<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 30 260 350" width="260" height="350">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a32"/>
      <stop offset="1" stop-color="#4a2c17"/>
    </linearGradient>
    <radialGradient id="oval" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#9c6b3e"/>
      <stop offset="1" stop-color="#3b2214"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- MTG card back -->
  <g transform="translate(200 200)" filter="url(#shadow)">
    <rect x="-110" y="-154" width="220" height="308" rx="14" fill="#2a180d"/>
    <rect x="-98" y="-142" width="196" height="284" rx="8" fill="url(#frame)"/>

    <!-- centre oval -->
    <ellipse rx="66" ry="100" fill="url(#oval)" stroke="#d9b27a" stroke-width="4"/>
    <ellipse rx="48" ry="78" fill="none" stroke="#c99a62" stroke-width="3" opacity="0.8"/>
    <ellipse rx="28" ry="50" fill="#c99a62" opacity="0.35"/>

    <!-- five mana orbs: W U B R G clockwise from the top -->
    <g stroke="#2a180d" stroke-width="3">
      <circle cx="0" cy="-122" r="13" fill="#f8f2d0"/>
      <circle cx="78" cy="-36" r="13" fill="#2a7bd1"/>
      <circle cx="50" cy="104" r="13" fill="#3a3a3c"/>
      <circle cx="-50" cy="104" r="13" fill="#d6392b"/>
      <circle cx="-78" cy="-36" r="13" fill="#2e8b43"/>
    </g>
    <g fill="#fff" opacity="0.6">
      <circle cx="-4" cy="-126" r="4"/>
      <circle cx="74" cy="-40" r="4"/>
      <circle cx="46" cy="100" r="4"/>
      <circle cx="-54" cy="100" r="4"/>
      <circle cx="-82" cy="-40" r="4"/>
    </g>
  </g>

</svg>
