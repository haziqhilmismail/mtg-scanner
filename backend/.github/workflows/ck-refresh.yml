name: Refresh CardKingdom pricelist

# Why this exists (post-Fly):
#   The backend now self-hosts on the homeserver, reachable publicly via
#   Tailscale Funnel. A residential IP is NOT on CardKingdom's WAF blocklist
#   (unlike Fly's range), so the backend can pull + rebuild the pricelist
#   itself. This workflow just *triggers* that refresh on a schedule — the
#   heavy download + rebuild happens on the homeserver, not here.
#
#   POST /api/refresh-ck is public (no auth) and rate-limited to 3/hour, so a
#   plain curl is all that's needed. No repo secrets required — you can delete
#   the old FLY_API_TOKEN secret.
#
# Setup: set BACKEND_URL below to your Funnel URL. Get it on the homeserver
# with `tailscale funnel status` (looks like https://tower.tailXXXX.ts.net).
#
# Schedule: 02:00 UTC daily (~10:00 MYT) — after CK's daily refresh, before the
# pasar-malam crowd needs prices. Manually triggerable from the Actions tab.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  # Tailscale Funnel URL for the homeserver backend (no trailing slash).
  BACKEND_URL: https://home-server.example.ts.net

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger CK refresh on the homeserver
        # The CK pricelist is ~50 MB and the rebuild takes a minute or two, so
        # allow a generous timeout. -f makes a non-2xx (e.g. 502 when CK is
        # unreachable, or 403 on a token mismatch) fail the step.
        # X-Refresh-Token must match REFRESH_CK_TOKEN in the backend's .env;
        # set the repo secret under Settings → Secrets → Actions. Empty secret
        # + empty backend token = endpoint stays open (back-compat).
        env:
          REFRESH_CK_TOKEN: ${{ secrets.REFRESH_CK_TOKEN }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/api/refresh-ck" \
            -H "X-Refresh-Token: $REFRESH_CK_TOKEN" \
            --max-time 600

      - name: Verify the index updated
        run: |
          curl -fsS "$BACKEND_URL/api/health" \
            | python3 -c "import sys,json;h=json.load(sys.stdin);print('cards:',h.get('cardkingdom_cards'),'refreshed_at:',h.get('cardkingdom_refreshed_at'))"
